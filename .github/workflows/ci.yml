name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: swift test --package-path Packages/SetLoopCore
      - name: Build app
        run: >
          xcodebuild build
          -project SetLoop.xcodeproj
          -scheme SetLoop
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
