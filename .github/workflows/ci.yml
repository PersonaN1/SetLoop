name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # Same major Xcode as local builds (Swift 6.2+, iOS 26 SDK).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - name: Core tests
        run: swift test --package-path Packages/SetLoopCore
      - name: Build app
        run: >
          xcodebuild build
          -project SetLoop.xcodeproj
          -scheme SetLoop
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
